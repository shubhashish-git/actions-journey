name: Release_Pipeline

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Lint code
        run: echo "linting code"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Run unit tests
        run: echo "running unit tests"

  package:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: Package code
        run: echo "packaging code"
